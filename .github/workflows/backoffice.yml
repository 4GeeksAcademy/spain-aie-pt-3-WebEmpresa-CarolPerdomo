name: Backoffice CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uis/backoffice
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: uis/backoffice/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build backoffice
        run: npm run build
