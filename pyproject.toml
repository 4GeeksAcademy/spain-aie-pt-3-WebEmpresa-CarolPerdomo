[project]
name = "webempresa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "carolperdomo4geeks", email = "carolperdomo885esp@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.7",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
webempresa = "webempresa:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
