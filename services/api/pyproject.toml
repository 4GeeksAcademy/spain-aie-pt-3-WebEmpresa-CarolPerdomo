[project]
name = "nexova-suppliers"
version = "0.1.0"
description = "Complete API for Nexova Solutions with Authentication and Supplier Management"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "tinydb>=4.8.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "sqlmodel>=0.0.24",
    "psycopg2-binary>=2.9.10",
]

[project.scripts]
seed = "nexova_suppliers.seed:seed_suppliers"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexova_suppliers"]
