[project]
name = "nexova-suppliers"
version = "0.1.0"
description = "Lightweight Storage API for Nexova Suppliers Directory"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "tinydb>=4.8.0",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.scripts]
seed = "seed:seed_suppliers"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
