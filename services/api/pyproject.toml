[project]
name = "nexova-suppliers"
version = "0.1.0"
description = "Complete API for Nexova Solutions with Authentication and Supplier Management"
requires-python = ">=3.9"

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic[email]>=2.0.0",
    "tinydb>=4.8.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
seed = "nexova_suppliers.seed:seed_suppliers"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider", "-m", "not integration"]
testpaths = ["tests"]
norecursedirs = ["tmp*"]
markers = ["integration: ASGI-level API behavior checks"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexova_suppliers"]
